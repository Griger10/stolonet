line-length = 100
target-version = "py313"
src = ["src", "tests"]

[lint]
select = [
    "E",
    "W",
    "F",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "T20",
    "RUF",
]

ignore = [
    "COM812",
    "ISC001",
]

fixable = ["ALL"]
unfixable = [
    "B904",
]

[lint.isort]
known-first-party = ["stolonet"]
combine-as-imports = true
force-sort-within-sections = true
split-on-trailing-comma = true


[lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG002",
]


[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
