[project]
name = "stolonet"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.19.1",
    "dishka==1.10.1",
    "dishka-faststream==0.7.0",
    "fastapi==0.141.1",
    "faststream==0.7.4",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.2",
    "zmqtt==0.1.0",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "pytest-mock>=3.15.1",
    "pytest-faker>=2.0.0",
    "mypy>=2.3.0",
    "isort>=8.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
