[project]
name = "stolonet"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dishka>=1.10.1",
    "fastapi==0.139.0",
    "faststream>=0.7.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "uvicorn==0.51.0",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
    "pytest-mock>=3.15.1",
    "pytest-faker>=2.0.0",
    "mypy>=2.3.0",
    "isort>=8.0.1",
]

