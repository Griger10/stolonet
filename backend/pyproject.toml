[project]
name = "stolonet"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "dishka>=1.10.1",
    "dishka-faststream>=0.7.0",
    "fastapi>=0.141.1",
    "faststream>=0.7.3",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
    "zmqtt>=0.0.6",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "pytest-mock>=3.15.1",
    "pytest-faker>=2.0.0",
    "mypy>=2.3.0",
    "isort>=8.0.1",
]

