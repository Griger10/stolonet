name: Question
description: Ask about setup, configuration, or using Stolonet.
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Check the [README](https://github.com/Griger10/stolonet/blob/HEAD/README.md) and existing issues first.
        For security concerns, use [the security policy](https://github.com/Griger10/stolonet/blob/HEAD/.github/SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to understand or accomplish?
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      description: Include documentation you checked, commands you ran, and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and context
      description: Include the affected component, commit or version, and setup details where relevant. Remove credentials and private data.
